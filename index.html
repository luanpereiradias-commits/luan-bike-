<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Carro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 400px;
      height: 600px;
      background: #222;
      border: 4px solid #444;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
    }

    canvas {
      display: block;
      background: #1a1a1a;
    }

    #ui {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    #score {
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 10px #00aaff;
    }

    #high-score {
      font-size: 14px;
      color: #aaa;
      margin-top: 4px;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(0, 0, 0, 0.85);
      padding: 30px 40px;
      border-radius: 15px;
      border: 2px solid #00aaff;
      display: none;
      z-index: 20;
    }

    #message h2 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #ff4444;
    }

    #message p {
      margin-bottom: 20px;
      color: #ccc;
    }

    #message button {
      background: #00aaff;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #message button:hover {
      background: #0088cc;
    }

    #controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #666;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div id="ui">
      <div id="score">0</div>
      <div id="high-score">Recorde: 0</div>
    </div>

    <div id="message">
      <h2>Game Over!</h2>
      <p id="final-score">Pontuação: 0</p>
      <button onclick="restartGame()">Jogar Novamente</button>
    </div>

    <div id="controls">
      ← → ou A D para mover | Espaço para pausar
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const messageEl = document.getElementById('message');
    const finalScoreEl = document.getElementById('final-score');

    // Configurações
    const ROAD_WIDTH = 280;
    const LANE_COUNT = 3;
    const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT;

    // Estado do jogo
    let gameRunning = true;
    let paused = false;
    let score = 0;
    let highScore = localStorage.getItem('carGameHighScore') || 0;
    let speed = 4;
    let frame = 0;

    highScoreEl.textContent = `Recorde: ${highScore}`;

    // Carro do jogador
    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 100,
      width: 40,
      height: 70,
      color: '#00aaff',
      speed: 6
    };

    // Obstáculos
    let obstacles = [];
    let roadLines = [];

    // Inicializa linhas da estrada
    for (let i = 0; i < 10; i++) {
      roadLines.push({
        y: i * 70
      });
    }

    // Controles
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (gameRunning) paused = !paused;
      }
    });
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    function createObstacle() {
      const lane = Math.floor(Math.random() * LANE_COUNT);
      const roadLeft = (canvas.width - ROAD_WIDTH) / 2;
      const colors = ['#ff4444', '#ff8800', '#aa44ff', '#44ff88', '#ffff44'];
      
      obstacles.push({
        x: roadLeft + lane * LANE_WIDTH + (LANE_WIDTH - 40) / 2,
        y: -80,
        width: 40,
        height: 70,
        color: colors[Math.floor(Math.random() * colors.length)],
        passed: false
      });
    }

    function drawRoad() {
      const roadLeft = (canvas.width - ROAD_WIDTH) / 2;

      // Grama / laterais
      ctx.fillStyle = '#1a3a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Estrada
      ctx.fillStyle = '#333';
      ctx.fillRect(roadLeft, 0, ROAD_WIDTH, canvas.height);

      // Bordas da estrada
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(roadLeft, 0);
      ctx.lineTo(roadLeft, canvas.height);
      ctx.moveTo(roadLeft + ROAD_WIDTH, 0);
      ctx.lineTo(roadLeft + ROAD_WIDTH, canvas.height);
      ctx.stroke();

      // Linhas tracejadas do meio
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.setLineDash([30, 30]);
      
      for (let i = 1; i < LANE_COUNT; i++) {
        const x = roadLeft + i * LANE_WIDTH;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Linhas horizontais (efeito de movimento)
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      roadLines.forEach(line => {
        ctx.fillRect(roadLeft + 5, line.y, ROAD_WIDTH - 10, 4);
      });
    }

    function drawCar(car) {
      // Corpo
      ctx.fillStyle = car.color;
      ctx.fillRect(car.x, car.y, car.width, car.height);

      // Teto
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(car.x + 6, car.y + 12, car.width - 12, 22);

      // Faróis
      ctx.fillStyle = '#ffffaa';
      ctx.fillRect(car.x + 5, car.y, 8, 6);
      ctx.fillRect(car.x + car.width - 13, car.y, 8, 6);

      // Lanternas
      ctx.fillStyle = '#ff2222';
      ctx.fillRect(car.x + 5, car.y + car.height - 8, 10, 8);
      ctx.fillRect(car.x + car.width - 15, car.y + car.height - 8, 10, 8);

      // Rodas
      ctx.fillStyle = '#111';
      ctx.fillRect(car.x - 4, car.y + 10, 6, 16);
      ctx.fillRect(car.x + car.width - 2, car.y + 10, 6, 16);
      ctx.fillRect(car.x - 4, car.y + car.height - 26, 6, 16);
      ctx.fillRect(car.x + car.width - 2, car.y + car.height - 26, 6, 16);
    }

    function update() {
      if (!gameRunning || paused) return;

      frame++;

      // Movimento do jogador
      const roadLeft = (canvas.width - ROAD_WIDTH) / 2;
      const roadRight = roadLeft + ROAD_WIDTH;

      if ((keys['arrowleft'] || keys['a']) && player.x > roadLeft + 5) {
        player.x -= player.speed;
      }
      if ((keys['arrowright'] || keys['d']) && player.x + player.width < roadRight - 5) {
        player.x += player.speed;
      }

      // Movimento das linhas da estrada
      roadLines.forEach(line => {
        line.y += speed * 1.5;
        if (line.y > canvas.height) {
          line.y = -20;
        }
      });

      // Spawn de obstáculos
      if (frame % Math.max(40, 90 - Math.floor(score / 5)) === 0) {
        createObstacle();
      }

      // Atualiza obstáculos
      obstacles.forEach((obs, index) => {
        obs.y += speed;

        // Pontuação
        if (!obs.passed && obs.y > player.y + player.height) {
          obs.passed = true;
          score++;
          scoreEl.textContent = score;

          // Aumenta velocidade
          if (score % 5 === 0) {
            speed += 0.3;
          }
        }

        // Colisão
        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          gameOver();
        }

        // Remove obstáculos fora da tela
        if (obs.y > canvas.height) {
          obstacles.splice(index, 1);
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawRoad();
      
      obstacles.forEach(obs => drawCar(obs));
      drawCar(player);

      if (paused && gameRunning) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSADO', canvas.width / 2, canvas.height / 2);
      }
    }

    function gameOver() {
      gameRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('carGameHighScore', highScore);
        highScoreEl.textContent = `Recorde: ${highScore}`;
      }
      finalScoreEl.textContent = `Pontuação: ${score}`;
      messageEl.style.display = 'block';
    }

    function restartGame() {
      score = 0;
      speed = 4;
      frame = 0;
      obstacles = [];
      player.x = canvas.width / 2 - 20;
      scoreEl.textContent = '0';
      messageEl.style.display = 'none';
      gameRunning = true;
      paused = false;
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Inicia o jogo
    gameLoop();
  </script>
</body>
</html>
