<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grau Bikes | Loja Oficial de Bikes e Peças de Grau</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{
  --preto:#0a0a0a;--cinza-escuro:#121212;--cinza:#1c1c1c;
  --laranja:#ff4d00;--laranja-hover:#ff6b2b;--branco:#f5f5f5;
  --cinza-texto:#9a9a9a;--verde:#00c853;--pix:#32BCAD;--roxo:#7c4dff;--vermelho:#ff3b5c;
}
body{font-family:'Inter',sans-serif;background:var(--preto);color:var(--branco);line-height:1.5}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}

.top-bar{background:var(--laranja);color:#fff;text-align:center;padding:9px 16px;font-size:.86rem;font-weight:600;letter-spacing:.3px}
header{background:rgba(10,10,10,.96);backdrop-filter:blur(14px);position:sticky;top:0;z-index:1000;border-bottom:1px solid #222}
.navbar{max-width:1320px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.95rem;letter-spacing:2px;white-space:nowrap}
.logo span{color:var(--laranja)}
.search-box{flex:1;max-width:440px;position:relative;min-width:200px}
.search-box input{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:11px 16px 11px 42px;color:#fff;font-size:.94rem;transition:.2s}
.search-box input:focus{outline:none;border-color:var(--laranja);background:#202020}
.search-box::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.95rem}

.nav-actions{display:flex;align-items:center;gap:10px}
.btn-icon-nav{background:#1a1a1a;border:1px solid #333;color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:6px;transition:.2s}
.btn-icon-nav:hover{border-color:var(--laranja);color:var(--laranja)}
.btn-icon-nav.active{border-color:var(--vermelho);color:var(--vermelho)}
.btn-carrinho{background:var(--laranja);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:8px;transition:.25s}
.btn-carrinho:hover{background:var(--laranja-hover);transform:translateY(-1px)}
.badge-pill{background:#fff;color:var(--laranja);font-size:.74rem;font-weight:800;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* HERO */
.hero{
  min-height:82vh;
  background:
    linear-gradient(135deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.6) 50%, rgba(255,77,0,.18) 100%),
    url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?q=80&w=2000') center/cover no-repeat;
  display:flex;align-items:center;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:110px;background:linear-gradient(transparent, var(--preto));pointer-events:none}
.hero-content{max-width:1320px;margin:0 auto;padding:48px 24px 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;width:100%;position:relative;z-index:2}
.hero-badge{display:inline-block;background:rgba(255,77,0,.15);border:1px solid rgba(255,77,0,.4);color:var(--laranja);padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.hero-text h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.2rem, 7.5vw, 5.6rem);letter-spacing:3px;line-height:.95;margin-bottom:18px}
.hero-text h1 span{color:var(--laranja)}
.hero-text .subtitle{font-size:1.08rem;color:#c2c2c2;max-width:490px;margin-bottom:28px;line-height:1.6}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:36px}
.btn-primary{background:var(--laranja);color:#fff;border:none;padding:15px 32px;font-size:1rem;font-weight:700;border-radius:10px;transition:.3s;display:inline-flex;align-items:center;gap:8px}
.btn-primary:hover{background:var(--laranja-hover);transform:translateY(-3px);box-shadow:0 14px 32px rgba(255,77,0,.4)}
.btn-secondary{background:rgba(255,255,255,.05);color:#fff;border:1px solid #444;padding:15px 28px;font-size:1rem;font-weight:600;border-radius:10px;transition:.3s}
.btn-secondary:hover{border-color:var(--laranja);color:var(--laranja)}
.hero-stats{display:flex;gap:32px;flex-wrap:wrap}
.stat-item strong{display:block;font-family:'Bebas Neue',sans-serif;font-size:2.1rem;color:var(--laranja);letter-spacing:1px;line-height:1}
.stat-item span{font-size:.85rem;color:var(--cinza-texto)}
.hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero-card{background:rgba(18,18,18,.88);backdrop-filter:blur(10px);border:1px solid #2a2a2a;border-radius:16px;padding:22px;transition:.3s}
.hero-card:hover{border-color:var(--laranja);transform:translateY(-4px)}
.hero-card .icon{font-size:1.8rem;margin-bottom:10px}
.hero-card h3{font-size:1rem;margin-bottom:6px}
.hero-card p{font-size:.82rem;color:var(--cinza-texto);line-height:1.45}

/* TRUST BAR */
.trust-bar{background:var(--cinza-escuro);border-bottom:1px solid #222;padding:16px 20px}
.trust-inner{max-width:1320px;margin:0 auto;display:flex;justify-content:space-around;gap:24px;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:10px;font-size:.88rem;color:#bdbdbd;font-weight:500}
.trust-item span{font-size:1.25rem}

/* CATEGORIAS */
.cats-section{max-width:1320px;margin:0 auto;padding:48px 20px 16px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:2.1rem;letter-spacing:2px;margin-bottom:4px}
.section-sub{color:var(--cinza-texto);margin-bottom:22px;font-size:.95rem}
.cats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cat-card{background:var(--cinza-escuro);border:1px solid #222;border-radius:14px;padding:26px 20px;text-align:center;transition:.3s;cursor:pointer}
.cat-card:hover{border-color:var(--laranja);transform:translateY(-5px);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.cat-card .cat-icon{font-size:2.2rem;margin-bottom:10px}
.cat-card h3{font-size:1.05rem;margin-bottom:4px}
.cat-card p{font-size:.82rem;color:var(--cinza-texto)}

/* LOJA */
.shop-layout{max-width:1320px;margin:0 auto;padding:30px 20px 80px;display:grid;grid-template-columns:265px 1fr;gap:28px}
.filtros-panel{background:var(--cinza-escuro);border:1px solid #222;border-radius:14px;padding:20px;height:fit-content;position:sticky;top:92px}
.filtros-panel h3{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:1px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.btn-limpar{background:none;border:1px solid #444;color:var(--cinza-texto);padding:4px 10px;border-radius:6px;font-size:.75rem;transition:.2s}
.btn-limpar:hover{border-color:var(--laranja);color:var(--laranja)}
.filtro-grupo{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #1f1f1f}
.filtro-grupo:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.filtro-grupo h4{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--cinza-texto);margin-bottom:10px}
.filtro-opcoes{display:flex;flex-direction:column;gap:9px}
.filtro-opcao{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.92rem;user-select:none}
.filtro-opcao input{appearance:none;width:18px;height:18px;border:2px solid #444;border-radius:4px;background:#1a1a1a;cursor:pointer;position:relative;flex-shrink:0;transition:.15s}
.filtro-opcao input:checked{background:var(--laranja);border-color:var(--laranja)}
.filtro-opcao input:checked::after{content:"✓";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.72rem;color:#fff;font-weight:700}
.filtro-opcao .count{margin-left:auto;font-size:.78rem;color:var(--cinza-texto)}
.preco-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.preco-inputs input{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:9px 10px;color:#fff;font-size:.9rem}
.preco-inputs input:focus{outline:none;border-color:var(--laranja)}
.btn-aplicar-preco{width:100%;background:var(--cinza);border:1px solid #333;color:#fff;padding:9px;border-radius:8px;font-weight:600;font-size:.88rem;transition:.25s}
.btn-aplicar-preco:hover{background:var(--laranja);border-color:var(--laranja)}
.chips-preco{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip-preco{background:var(--cinza);border:1px solid #333;color:var(--cinza-texto);padding:5px 10px;border-radius:20px;font-size:.76rem;transition:.2s;cursor:pointer}
.chip-preco:hover,.chip-preco.active{background:var(--laranja);border-color:var(--laranja);color:#fff}

.produtos-area{min-width:0}
.produtos-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.produtos-count{color:var(--cinza-texto);font-size:.95rem}
.sort-select{background:var(--cinza);border:1px solid #333;color:#fff;padding:9px 14px;border-radius:8px;font-size:.9rem;cursor:pointer}
.sort-select:focus{outline:none;border-color:var(--laranja)}
.produtos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:20px}
.produto-card{background:var(--cinza-escuro);border-radius:14px;overflow:hidden;border:1px solid #222;transition:.3s;display:flex;flex-direction:column;position:relative}
.produto-card:hover{transform:translateY(-6px);border-color:var(--laranja);box-shadow:0 18px 36px rgba(0,0,0,.45)}
.produto-img{height:210px;background:#111;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;padding:12px}
.produto-img img{max-width:90%;max-height:90%;object-fit:contain;transition:.4s}
.produto-card:hover .produto-img img{transform:scale(1.07)}
.badge{position:absolute;top:11px;left:11px;background:var(--laranja);color:#fff;padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:700;z-index:2;letter-spacing:.5px}
.badge.novo{background:var(--verde)}.badge.promo{background:#e91e63}.badge.peca{background:var(--roxo)}

.btn-fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(18,18,18,.85);border:1px solid #333;color:#aaa;font-size:1rem;display:flex;align-items:center;justify-content:center;z-index:3;transition:.2s}
.btn-fav:hover{border-color:var(--vermelho);transform:scale(1.08)}
.btn-fav.liked{color:var(--vermelho);border-color:var(--vermelho);background:rgba(255,59,92,.12)}

.btn-quick{position:absolute;bottom:12px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.88);border:1px solid #444;color:#fff;padding:7px 14px;border-radius:8px;font-size:.78rem;font-weight:600;opacity:0;transition:.3s;white-space:nowrap}
.produto-card:hover .btn-quick{opacity:1;transform:translateX(-50%) translateY(0)}
.produto-info{padding:16px;flex:1;display:flex;flex-direction:column}
.marca{color:var(--laranja);font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.produto-info h3{font-size:1.05rem;margin-bottom:4px;line-height:1.3;cursor:pointer}
.produto-info h3:hover{color:var(--laranja)}
.categoria{color:var(--cinza-texto);font-size:.8rem;margin-bottom:12px}
.preco-box{margin-top:auto}
.pix-tag{font-size:.78rem;color:var(--pix);font-weight:600;margin-bottom:2px}
.valor{font-size:1.3rem;font-weight:700;color:var(--branco)}
.parcelas{font-size:.78rem;color:var(--cinza-texto);margin-top:2px}
.btn-add{width:100%;margin-top:12px;background:transparent;border:2px solid var(--laranja);color:var(--laranja);padding:10px;border-radius:8px;font-weight:700;font-size:.9rem;transition:.25s}
.btn-add:hover{background:var(--laranja);color:#fff}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;background:var(--cinza-escuro);border-radius:14px;border:1px dashed #333}
.empty-state p{color:var(--cinza-texto);margin-bottom:16px}

/* MODAL PRODUTO */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:2500;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.3s;padding:20px}
.modal-overlay.open{opacity:1;visibility:visible}
.modal-produto{background:var(--cinza-escuro);border-radius:16px;width:100%;max-width:780px;max-height:92vh;overflow-y:auto;border:1px solid #333;display:grid;grid-template-columns:1fr 1.1fr;position:relative}
.modal-img{background:#111;display:flex;align-items:center;justify-content:center;padding:30px;min-height:280px}
.modal-img img{max-width:100%;max-height:320px;object-fit:contain}
.modal-info{padding:26px;display:flex;flex-direction:column}
.modal-info h2{font-size:1.5rem;margin-bottom:4px;line-height:1.25}
.modal-pix{color:var(--pix);font-weight:700;font-size:.95rem;margin-top:6px}
.modal-preco{font-size:1.75rem;font-weight:700;color:var(--laranja);margin-bottom:2px}
.modal-parcelas{color:var(--cinza-texto);font-size:.86rem;margin-bottom:12px}
.modal-desc{color:#ccc;font-size:.9rem;margin-bottom:16px;line-height:1.55}

.var-label{font-size:.8rem;color:var(--cinza-texto);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:block}
.var-options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.var-chip{background:#1a1a1a;border:1px solid #333;color:#ddd;padding:6px 13px;border-radius:8px;font-size:.84rem;font-weight:600;transition:.2s}
.var-chip.active,.var-chip:hover{border-color:var(--laranja);background:rgba(255,77,0,.15);color:#fff}

.parcelas-toggle{background:none;border:none;color:var(--laranja);font-size:.82rem;font-weight:600;text-align:left;margin-bottom:10px;text-decoration:underline}
.parcelas-grid{display:none;background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:10px;margin-bottom:14px;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.78rem;color:#bbb}
.parcelas-grid.show{display:grid}

.modal-actions{margin-top:auto}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.7);border:1px solid #333;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.3rem;display:flex;align-items:center;justify-content:center;z-index:5;transition:.2s}
.modal-close:hover{border-color:var(--laranja);color:var(--laranja)}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#1f1f1f;border:1px solid var(--laranja);color:#fff;padding:13px 22px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:9999;opacity:0;transition:.35s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* CARRINHO LATERAL */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;opacity:0;visibility:hidden;transition:.3s}
.cart-overlay.open{opacity:1;visibility:visible}
.cart-sidebar{position:fixed;top:0;right:-450px;width:430px;max-width:96%;height:100%;background:var(--cinza-escuro);z-index:2001;transition:.35s;display:flex;flex-direction:column;border-left:1px solid #333}
.cart-sidebar.open{right:0}
.cart-header{padding:16px 20px;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center}
.cart-header h3{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;letter-spacing:1px}
.close-cart{background:none;border:none;color:var(--cinza-texto);font-size:1.7rem;line-height:1}
.close-cart:hover{color:#fff}

.shipping-bar{background:#181818;padding:11px 20px;border-bottom:1px solid #262626;font-size:.82rem}
.shipping-text{margin-bottom:6px;color:#ddd}
.shipping-text strong{color:var(--verde)}
.progress-track{height:6px;background:#2a2a2a;border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:var(--verde);width:0%;transition:.4s}

.cart-items{flex:1;overflow-y:auto;padding:12px 20px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #242424}
.cart-item img{width:64px;height:64px;object-fit:contain;background:#111;border-radius:8px;padding:4px}
.cart-item-info{flex:1}
.cart-item-info h4{font-size:.92rem;margin-bottom:2px}
.cart-item-var{font-size:.76rem;color:var(--cinza-texto);margin-bottom:3px}
.cart-item-info .preco{color:var(--laranja);font-weight:700;font-size:.94rem}
.qty-controls{display:flex;align-items:center;gap:10px;margin-top:6px}
.qty-btn{width:26px;height:26px;border:1px solid #444;background:#222;color:#fff;border-radius:6px;font-weight:700}
.qty-btn:hover{border-color:var(--laranja)}
.remove-item{background:none;border:none;color:#ff5252;font-size:.78rem;margin-left:auto}

.cart-tools{padding:12px 20px;background:#161616;border-top:1px solid #262626;display:flex;flex-direction:column;gap:8px}
.tool-row{display:flex;gap:8px}
.tool-row input{flex:1;background:#111;border:1px solid #333;border-radius:8px;padding:8px 11px;color:#fff;font-size:.84rem}
.tool-row input:focus{outline:none;border-color:var(--laranja)}
.tool-row button{background:#262626;border:1px solid #3a3a3a;color:#fff;padding:8px 13px;border-radius:8px;font-size:.82rem;font-weight:600;white-space:nowrap}
.tool-row button:hover{border-color:var(--laranja);color:var(--laranja)}
.tool-feedback{font-size:.78rem;color:var(--verde)}

.cart-footer{padding:16px 20px;border-top:1px solid #2a2a2a}
.cart-subrow{display:flex;justify-content:space-between;font-size:.86rem;color:var(--cinza-texto);margin-bottom:5px}
.cart-total{display:flex;justify-content:space-between;font-size:1.18rem;font-weight:700;margin-bottom:12px;padding-top:8px;border-top:1px solid #222}
.cart-total span:last-child{color:var(--laranja)}
.btn-finalizar{width:100%;background:var(--laranja);color:#fff;border:none;padding:13px;border-radius:8px;font-weight:700;font-size:.94rem;margin-bottom:8px;transition:.2s}
.btn-finalizar:hover{background:var(--laranja-hover)}
.btn-whatsapp{width:100%;background:#25d366;color:#fff;border:none;padding:11px;border-radius:8px;font-weight:700;font-size:.88rem}
.empty-cart{text-align:center;padding:50px 20px;color:var(--cinza-texto)}

/* CHECKOUT & PEDIDOS MODAL */
.checkout-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:3000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.3s;padding:20px}
.checkout-overlay.open{opacity:1;visibility:visible}
.checkout-modal{background:var(--cinza-escuro);border-radius:16px;width:100%;max-width:510px;max-height:90vh;overflow-y:auto;border:1px solid #333}
.checkout-header{padding:18px 22px;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center}
.checkout-header h3{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:1px}
.checkout-body{padding:22px}
.payment-methods{display:grid;gap:10px;margin-bottom:20px}
.payment-option{display:flex;align-items:center;gap:14px;padding:13px 15px;background:var(--cinza);border:2px solid #333;border-radius:12px;transition:.2s;cursor:pointer}
.payment-option:hover,.payment-option.active{border-color:var(--laranja);background:#1a1a1a}
.payment-option input{display:none}
.payment-option .icon{font-size:1.4rem;width:32px;text-align:center}
.payment-option .info h4{font-size:.96rem}
.payment-option .info p{font-size:.8rem;color:var(--cinza-texto)}
.pix-area,.card-form,.boleto-area{display:none}
.pix-area.show,.card-form.show,.boleto-area.show{display:block}
.pix-qr{width:170px;height:170px;background:#fff;margin:0 auto 14px;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center}
.pix-qr img{width:100%;height:100%;object-fit:contain}
.pix-code{background:#111;border:1px solid #333;border-radius:8px;padding:11px;font-family:monospace;font-size:.76rem;word-break:break-all;margin-bottom:12px;color:#ccc}
.btn-copy{background:var(--pix);color:#000;border:none;padding:12px;border-radius:8px;font-weight:700;width:100%;margin-bottom:10px}
.pix-timer{color:var(--cinza-texto);font-size:.88rem;text-align:center}
.pix-timer span{color:var(--laranja);font-weight:700}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.82rem;color:var(--cinza-texto);margin-bottom:5px}
.form-group input{width:100%;background:#111;border:1px solid #333;border-radius:8px;padding:11px 13px;color:#fff;font-size:.93rem}
.form-group input:focus{outline:none;border-color:var(--laranja)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.boleto-code{background:#111;border:1px solid #333;border-radius:8px;padding:14px;font-family:monospace;font-size:.86rem;margin:14px 0;text-align:center}
.btn-pay{width:100%;background:var(--laranja);color:#fff;border:none;padding:15px;border-radius:8px;font-weight:700;font-size:1rem;margin-top:14px}
.success-screen{text-align:center;padding:24px 10px}
.success-icon{font-size:3.8rem;margin-bottom:12px}

.order-card{background:#181818;border:1px solid #2b2b2b;border-radius:12px;padding:14px;margin-bottom:12px}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.88rem}
.order-status{background:rgba(0,200,83,.15);color:var(--verde);padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
